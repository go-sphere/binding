syntax = "proto3";

// buf:lint:ignore PACKAGE_VERSION_SUFFIX
package sphere.binding;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/go-sphere/binding/sphere/binding";

// BindingLocation specifies where an HTTP request parameter or body component
// is bound to a Protobuf message field. Used by protoc-gen-sphere-binding and
// protoc-gen-sphere code generators to produce Go struct tags and binder calls.
//
// Preconditions: Used during Protobuf schema definition. QUERY, URI, and HEADER
// locations are valid only on scalar types (numeric, string, bool) and well-known scalar types.
// Concurrency: Enum values are immutable and safe for concurrent use.
// Lifecycle: Handled statically at code generation time; descriptors are registered at init().
// Error semantics: Invalid locations for complex types are rejected at code-generation time.
// Side-effects: Pure schema metadata; no runtime background tasks or context mutation.
enum BindingLocation {
  // BINDING_LOCATION_UNSPECIFIED is the default zero value; indicates no explicit
  // binding location is specified. Falls back to message default_location if set.
  BINDING_LOCATION_UNSPECIFIED = 0;
  // BINDING_LOCATION_QUERY binds the field to HTTP URL query parameters (e.g. `?name=val`).
  // Generates `query:"<name>"` struct tag. Supported only on scalar and well-known scalar types.
  BINDING_LOCATION_QUERY = 1;
  // BINDING_LOCATION_URI binds the field to URL path/route parameters (e.g. `/users/:id`).
  // Generates `uri:"<name>"` struct tag. Supported only on scalar and well-known scalar types.
  BINDING_LOCATION_URI = 2;
  // BINDING_LOCATION_JSON binds the field to the HTTP request JSON body.
  // Preserves standard `json:"<name>"` tag.
  BINDING_LOCATION_JSON = 3;
  // BINDING_LOCATION_FORM binds the field to HTTP form or multipart/form-data body parameters.
  // Generates `form:"<name>"` struct tag.
  BINDING_LOCATION_FORM = 4;
  // BINDING_LOCATION_HEADER binds the field to HTTP request headers.
  // Generates `header:"<name>"` struct tag. Supported only on scalar and well-known scalar types.
  BINDING_LOCATION_HEADER = 5;
}

extend google.protobuf.MessageOptions {
  // default_location defines the default BindingLocation for all fields in this message
  // that do not specify their own field-level location option.
  // Preconditions: Must be a valid BindingLocation enum value.
  // Concurrency: Extension descriptors are immutable after registration in init().
  optional BindingLocation default_location = 136655300;
  // default_auto_tags specifies tag keys (e.g. "form", "json") that should be automatically
  // generated with the field's proto name for all fields in this message.
  // Preconditions: Tag keys must be non-empty and must not contain spaces or quotes.
  // Concurrency: Slices returned by GetExtension are direct references; callers must not mutate concurrently.
  repeated string default_auto_tags = 136655301;
}

extend google.protobuf.OneofOptions {
  // default_oneof_location defines the default BindingLocation for all fields within this oneof group.
  // Preconditions: Must be a valid BindingLocation enum value.
  // Concurrency: Extension descriptors are immutable after registration in init().
  optional BindingLocation default_oneof_location = 136655310;
  // default_oneof_auto_tags specifies tag keys automatically generated for fields within this oneof group.
  // Preconditions: Tag keys must be non-empty and must not contain spaces or quotes.
  // Concurrency: Slices returned by GetExtension are direct references; callers must not mutate concurrently.
  repeated string default_oneof_auto_tags = 136655311;
}

extend google.protobuf.FieldOptions {
  // location overrides default_location for this specific field.
  // Preconditions: Must be a valid BindingLocation. QUERY/URI/HEADER restricted to scalar types.
  // Concurrency: Extension descriptors are immutable after registration in init().
  optional BindingLocation location = 136655320;
  // tags specifies explicit Go struct tag strings to apply to the generated field
  // (e.g. 'validate:"required,min=1"'). Each string must be valid Go struct tag syntax.
  // Preconditions: Must conform to standard Go struct tag key:"value" syntax.
  // Concurrency: Slices returned by GetExtension are direct references; callers must not mutate concurrently.
  repeated string tags = 136655321;
  // auto_tags specifies tag keys (e.g. "param", "schema") to generate for this field using the field's name.
  // Preconditions: Tag keys must be non-empty and must not contain spaces or quotes.
  // Concurrency: Slices returned by GetExtension are direct references; callers must not mutate concurrently.
  repeated string auto_tags = 136655322;
}
